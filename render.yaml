# Blueprint de Render para el frontend (sitio estático).
# Build: Angular 22 · Publica dist/smart-garden-web/browser
services:
  - type: web
    name: smart-garden-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/smart-garden-web/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
